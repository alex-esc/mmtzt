<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stereo to Mono (Left Channel) Converter</title>
    
    <!-- Load FFmpeg.wasm UMD scripts -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>

    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        #drop-zone {
            width: 80%;
            max-width: 600px;
            height: 300px;
            border: 3px dashed #4CAF50;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #1e1e1e;
            transition: all 0.3s ease;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #drop-zone.dragover {
            background-color: #2e3d2e;
            border-color: #81c784;
            transform: scale(1.02);
        }

        #drop-zone.disabled {
            border-color: #555;
            background-color: #1a1a1a;
            color: #888;
            pointer-events: none;
        }

        #status {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #4CAF50;
        }

        h1 { margin-bottom: 10px; }
        p { color: #aaaaaa; }
    </style>
</head>
<body>

    <h1>WAV to Mono Converter</h1>
    <p>Keeps only the Left channel. Processes entirely in your browser.</p>

    <div id="drop-zone" class="disabled">
        <h2 id="drop-text">Loading FFmpeg engine... Please wait.</h2>
    </div>

    <div id="status"></div>

    <script>
        // THIS WAS THE FIX: Updated to the correct v0.12 global variable names
        const { FFmpeg } = window.FFmpegWASM;
        const { fetchFile } = window.FFmpegUtil;
        
        let ffmpeg = null;

        const dropZone = document.getElementById('drop-zone');
        const dropText = document.getElementById('drop-text');
        const statusEl = document.getElementById('status');

        // Helper function to load files from CDN properly
        async function toBlobURL(url, mimeType) {
            const resp = await fetch(url);
            const blob = await resp.blob();
            return URL.createObjectURL(new Blob([blob], { type: mimeType }));
        }

        // Initialize FFmpeg
        async function loadFFmpeg() {
            try {
                ffmpeg = new FFmpeg();
                
                // Optional: Log progress to the F12 console
                ffmpeg.on('log', ({ message }) => console.log(message));
                
                const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
                
                await ffmpeg.load({
                    coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
                    wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
                });
                
                // Enable UI once loaded
                dropZone.classList.remove('disabled');
                dropText.innerText = "Drag & Drop WAV files here";
                statusEl.innerText = "Ready!";
            } catch (err) {
                dropText.innerText = "Error loading FFmpeg. Press F12 for details.";
                console.error("FFmpeg Load Error:", err);
            }
        }

        // Process a single file
        async function processFile(file) {
            const originalName = file.name;
            
            // Construct the new filename
            const dotIndex = originalName.lastIndexOf('.');
            const name = dotIndex !== -1 ? originalName.substring(0, dotIndex) : originalName;
            const ext = dotIndex !== -1 ? originalName.substring(dotIndex) : '.wav';
            const outName = `${name}_mono${ext}`;

            statusEl.innerText = `Processing: ${originalName}...`;

            try {
                // 1. Write file to FFmpeg's virtual file system
                await ffmpeg.writeFile(originalName, await fetchFile(file));

                // 2. Run the command to keep only the Left channel
                await ffmpeg.exec([
                    '-i', originalName, 
                    '-af', 'pan=1c|c0=c0', 
                    outName
                ]);

                // 3. Read the result back
                const data = await ffmpeg.readFile(outName);

                // 4. Download it automatically
                const blob = new Blob([data.buffer], { type: 'audio/wav' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = outName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                // 5. Clean up memory
                await ffmpeg.deleteFile(originalName);
                await ffmpeg.deleteFile(outName);

            } catch (error) {
                console.error(`Failed to process ${originalName}:`, error);
                alert(`Error processing ${originalName}. Check console.`);
            }
        }

        // Handle File Drops
        async function handleFiles(files) {
            dropZone.classList.add('disabled');
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                if (!file.type.startsWith('audio/') && !file.name.toLowerCase().endsWith('.wav')) {
                    console.warn(`Skipping non-audio file: ${file.name}`);
                    continue;
                }
                statusEl.innerText = `Processing file ${i + 1} of ${files.length}...`;
                await processFile(file);
            }

            statusEl.innerText = "All files processed!";
            dropZone.classList.remove('disabled');
        }

        // --- Drag and Drop Event Listeners ---
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                handleFiles(e.dataTransfer.files);
            }
        });

        // Start loading FFmpeg
        loadFFmpeg();
    </script>
</body>
</html>
